name: Útgáfa

# Keyrir tegar tagg sem byrjar a "v" er ytt (t.d. v0.94). Byggir UNDIRRITAD
# release-APK og birtir tad sem alvoru GitHub Release - ekki bara
# Actions-artifact, sem er timabundid og finnst ekki undir Releases-flipanum.
#
# Undirritunin er ekki formsatridi: Android hafnar uppfaerslu sem er
# undirritud odrum lykli en tad sem fyrir er. Debug-undirritud APK (v0.92
# og v0.93) knudu folk til ad fjarlaegja appid - og tapa vekjarastillingum -
# vid hverja uppfaerslu. Fjogur leyndarmal turfa ad vera til stadar:
# KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Keyra próf
        run: ./gradlew test --no-daemon

      # Stodvum HER ef lykilinn vantar. An tessa myndi assembleRelease
      # skila app-release-unsigned.apk, skrefid a eftir fyndi ekki skrana
      # og keyrslan felli a oskiljanlegri villu - eda verra, birti APK sem
      # enginn getur sett upp.
      - name: Athuga að undirritunarlykill sé til staðar
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 vantar. Utgafan yrdi ounderritud og oupsettanleg. Sja kafla 10 i LESTU_MIG.md."
            exit 1
          fi

      # Lykillinn fer i RUNNER_TEMP, aldrei i vinnutred - tar gaeti hann
      # ratad i APK-id eda i git.
      - name: Afkóða undirritunarlykil
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/morgunbaen.jks"

      - name: Byggja undirritað APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/morgunbaen.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # Prentar SHA-256 vottordsins i loggid. Beri madur tad saman milli
      # utgafna sest strax ef lyklinum var skipt ut - sem myndi brjota
      # uppfaersluleidina fyrir alla sem eru med eldri utgafu.
      - name: Staðfesta undirritun
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Birta útgáfu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="morgunbaen-${{ github.ref_name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          TAG="${{ github.ref_name }}"
          {
            awk -v tag="$TAG" '
              $0 == "## " tag { p=1; next }
              /^## / && p { exit }
              p
            ' BREYTINGAR.md
            echo
            echo "**Breytingaskrá:** https://github.com/Addi-eh/morgunbaen-android/blob/master/BREYTINGAR.md"
          } > /tmp/release-notes.md
          gh release create "$TAG" \
            "$APK" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md
