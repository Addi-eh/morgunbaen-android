name: Útgáfa

# Keyrir tegar tagg sem byrjar a "v" er ytt (t.d. v0.92). Byggir APK og
# birtir tad sem alvoru GitHub Release - ekki bara Actions-artifact, sem
# er timabundid og finnst ekki undir Releases-flipanum.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Keyra próf
        run: ./gradlew test --no-daemon

      - name: Byggja APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Birta útgáfu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "${{ github.ref_name }}" \
            --generate-notes
