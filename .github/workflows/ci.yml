name: Próf og bygging

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Einingapróf
        run: ./gradlew test --no-daemon

      - name: Byggja APK
        run: ./gradlew assembleDebug --no-daemon

      # Prófaskýrslan er það eina sem segir hvað féll þegar keyrslan
      # verður rauð. Hún á að vera til staðar líka þá.
      - name: Geyma prófaskýrslu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profaskyrsla
          path: app/build/reports/tests/
